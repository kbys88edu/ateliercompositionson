<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ink:#000000;
  --blue:#7A3B12; --red:#CC2E1A; --green:#8A6A12;
  --blue-bg:#F8F3EE; --red-bg:#FDF4F2; --green-bg:#FAF6EA;
  --rule:#000000; --rule-soft:#D9D0C6;
  --serif:"Noto Serif","Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","IPAexMincho","IPAMincho",serif;
  --sans:"Noto Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Hiragino Kaku Gothic Pro","Yu Gothic Medium","Yu Gothic","YuGothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","IPAexGothic","IPAPGothic",sans-serif;
  --measure:40rem;
}
*{box-sizing:border-box}

html{background:#FFFFFF}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16.5px;line-height:1.95;margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:74rem;margin:0 auto;padding-inline:20px;padding-block:0 5rem}
.lat,.sym{font-family:var(--serif);font-weight:500}
.sym{letter-spacing:.02em}

/* ---- masthead ---- */
header.top{padding-block:4rem 2.2rem;border-bottom:2px solid var(--ink);max-width:var(--measure)}
.kicker{font-family:var(--sans);font-weight:700;font-size:.78rem;letter-spacing:.18em;
  color:var(--blue);margin:0 0 1rem}
h1{font-family:var(--sans);font-weight:700;font-size:clamp(2rem,5.2vw,2.8rem);line-height:1.4;
  margin:0 0 1.1rem;text-wrap:balance}
.sub{color:var(--ink);margin:0;font-size:1rem}
.origin{margin:1.5rem 0 0;font-size:.85rem;color:var(--ink);line-height:1.8;
  border-left:3px solid var(--rule-soft);padding-left:1rem}

/* ---- layout ---- */
.cols{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:3.5rem;margin-top:2.6rem;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr);gap:0}}
nav.toc{position:sticky;top:4.2rem;font-size:.82rem;line-height:1.7;
  border-left:1px solid var(--rule-soft);padding-left:1.1rem}
@media (max-width:1000px){nav.toc{display:none}}
nav.toc b{display:block;font-family:var(--sans);font-weight:700;font-size:.88rem;
  margin:1.4rem 0 .45rem;color:var(--ink)}
nav.toc b:first-child{margin-top:0}
nav.toc a{display:block;color:var(--ink);text-decoration:none;padding:.16rem 0}
nav.toc a:hover{color:var(--blue);text-decoration:underline}
nav.toc a .n{font-family:var(--sans);color:var(--blue);margin-right:.45rem}

main{max-width:var(--measure);min-width:0}
main.hasfigs{max-width:100%}
main p,main ul,main ol,main h2,main h3,main .note,main .box,main .warn,main .cap{max-width:var(--measure)}

/* ---- headings ---- */
h2{font-family:var(--sans);font-weight:700;font-size:1.5rem;line-height:1.5;
  margin:4.2rem 0 .4rem;padding-top:1.5rem;border-top:3px solid var(--ink);text-wrap:balance}
h2 .ch{display:block;font-family:var(--sans);font-weight:700;font-size:.74rem;letter-spacing:.18em;
  color:var(--blue);margin-bottom:.5rem}
h3{font-family:var(--sans);font-weight:700;font-size:1.14rem;line-height:1.6;
  margin:3rem 0 .9rem;display:flex;gap:.7rem;align-items:baseline;text-wrap:balance}
h3 .n{font-family:var(--sans);font-size:.95rem;color:#FFFFFF;background:var(--blue);
  font-weight:700;min-width:1.6rem;height:1.6rem;border-radius:50%;display:inline-grid;
  place-items:center;flex:none;line-height:1;align-self:center}
h4{font-family:var(--sans);font-weight:700;font-size:.95rem;margin:2rem 0 .5rem}
p{margin:0 0 1.15rem}
main>p:first-of-type{margin-top:1.2rem}

/* ---- terms ---- */
.t{font-weight:700;color:var(--blue)}

/* ---- callouts ---- */
.note{border-left:3px solid var(--rule-soft);padding:.1rem 0 .1rem 1.1rem;margin:1.6rem 0;
  font-size:.92rem;line-height:1.85}
.warn{border:1px solid var(--red);background:var(--red-bg);padding:.9rem 1.1rem;
  margin:1.6rem 0;font-size:.92rem;line-height:1.85}
.warn b{color:var(--red)}
.box{border:1px solid var(--green);background:var(--green-bg);padding:1.2rem 1.3rem;margin:1.8rem 0}
.box h4{margin-top:0;color:var(--green)}
.box p:last-child,.box ul:last-child,.box ol:last-child{margin-bottom:0}

ul,ol{margin:0 0 1.15rem;padding-left:1.3rem}
li{margin-bottom:.4rem}
ol.steps{list-style:none;padding-left:0;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding-left:2.6rem;margin-bottom:1.1rem}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:.3rem;width:1.75rem;height:1.75rem;
  border-radius:50%;background:var(--blue);color:#FFFFFF;font-family:var(--sans);font-weight:700;
  font-size:.9rem;display:grid;place-items:center;line-height:1}

/* ---- tables ---- */
.tw{overflow-x:auto;margin:1.6rem 0;max-width:var(--measure)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:23rem}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--rule-soft);vertical-align:baseline}
thead th{font-size:.76rem;letter-spacing:.06em;font-weight:700;
  border-bottom:2px solid var(--ink);white-space:nowrap}
td.sym,th.sym{font-family:var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:1px solid var(--rule-soft)}
td.deg{color:var(--blue);font-family:var(--serif);font-weight:700}

/* ---- scores ---- */
figure.score{margin:2rem 0 2.4rem;max-width:min(var(--fw,52rem),100%)}
.stave{background:#FFFFFF;border:1px solid var(--rule-soft);
  padding:.6rem 1rem;color:var(--ink);overflow-x:auto}
.stave svg{display:block;width:100%;height:auto;min-width:min(var(--fw,100%),520px)}
figcaption{margin-top:.55rem;font-size:.84rem;line-height:1.75}
.fignum{font-family:var(--sans);font-weight:700;color:var(--blue);margin-right:.6rem;white-space:nowrap}

/* ---- exercise ---- */
details.sol{border:1px solid var(--green);margin:1.4rem 0 2.4rem;max-width:min(52rem,100%)}
details.sol>summary{cursor:pointer;padding:.72rem 1.1rem;font-size:.9rem;font-weight:700;
  color:var(--green);background:var(--green-bg);list-style:none;display:flex;align-items:center;gap:.55rem}
details.sol>summary::-webkit-details-marker{display:none}
details.sol>summary::before{content:"▸";font-size:.8rem;transition:transform .15s}
details.sol[open]>summary::before{transform:rotate(90deg)}
details.sol>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.solbody{padding:0 1.1rem 1rem;border-top:1px solid var(--green)}
.solbody figure.score{margin-top:1.2rem}
.solbody .stave{border:none;padding-left:0;padding-right:0}
.solbody p{font-size:.92rem}

/* ---- glossary ---- */
.gloss td:first-child{font-weight:700;white-space:nowrap}
footer{margin-top:5rem;padding-top:1.8rem;border-top:2px solid var(--ink);
  font-size:.83rem;line-height:1.85;max-width:var(--measure)}
a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 枠の角を丸く */
.box,.warn,details.sol{border-radius:12px}
figure.score .stave{border-radius:12px;overflow:hidden}

.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem;margin:1.2rem 0 2.2rem;max-width:var(--measure)}
.player{margin:.5rem 0 0;max-width:var(--measure)}
.player audio{width:100%;height:36px;display:block;margin-top:.25rem}
.alab{display:block;font-family:var(--sans);font-weight:700;font-size:.82rem;color:var(--blue)}
figure.score .stave{overflow-x:auto} figure.score svg{width:100%;height:auto;display:block}
p.src{font-size:.82rem;color:#5a5048;margin-top:2.4rem;max-width:var(--measure)}
p.lead{font-size:1.05rem;line-height:1.9;margin-top:1.2rem;max-width:var(--measure)}
</style>
