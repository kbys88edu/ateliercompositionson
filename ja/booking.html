<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30分無料相談 お申し込み｜Atelier Composition Son</title>
  <meta name="description" content="Atelier Composition Sonの30分無料相談専用フォーム。作曲、DTM、音楽理論、ソルフェージュ、和声・対位法、電子音響、AI音楽制作、受験・ポートフォリオについて相談できます。" />
  <link rel="canonical" href="https://ateliercompositionson.com/ja/booking.html" />
  <meta property="og:image" content="https://ateliercompositionson.com/images/contact_hero.png" />
  <link rel="icon" href="../images/acs-logo.png" type="image/png" />

  <style>
    :root {
      --bg: #f8f6f1;
      --text: #111;
      --muted: #67625a;
      --line: #151515;
      --fine-line: rgba(17, 17, 17, 0.18);
      --card: #fffefa;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(17, 17, 17, 0.035) 1px, transparent 1px) 0 0 / 25vw 100%,
        var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.85;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 5vw;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 246, 241, 0.92);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 52px 24px 92px;
    }

    .form-hero {
      width: min(1120px, calc(100vw - 48px));
      margin: 0 50% 46px;
      transform: translateX(-50%);
      background: #fff;
    }

    .form-hero img {
      display: block;
      width: 100%;
      height: clamp(260px, 42vw, 560px);
      object-fit: cover;
      object-position: center;
    }

    .kicker {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.22em;
      text-align: center;
      text-transform: uppercase;
    }

    .mark {
      width: 54px;
      height: 2px;
      margin: 22px auto 28px;
      background: var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 62px);
      line-height: 1.18;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .intro {
      max-width: 560px;
      margin: 24px auto 28px;
      color: var(--text);
      font-size: 17px;
      line-height: 1.9;
      text-align: center;
    }

    .badges {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 28px auto 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      max-width: 620px;
      background: rgba(255, 254, 250, 0.52);
    }

    .badges span {
      flex: 1 1 0;
      padding: 11px 14px;
      border-right: 1px solid var(--fine-line);
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }

    .badges span:last-child {
      border-right: 0;
    }

    form {
      display: grid;
      gap: 24px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label,
    legend {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      background: rgba(255, 254, 250, 0.86);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      padding: 15px 16px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.12);
    }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .choice {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      padding: 12px 14px;
      background: rgba(255, 254, 250, 0.6);
      cursor: pointer;
      font-weight: 400;
    }

    .choice input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      padding: 0;
      accent-color: var(--text);
    }

    .submit-row {
      display: grid;
      gap: 16px;
      margin-top: 8px;
    }

    button {
      min-height: 62px;
      border: 1px solid var(--line);
      background: var(--text);
      color: var(--bg);
      font: inherit;
      font-size: 18px;
      letter-spacing: 0.12em;
      cursor: pointer;
    }

    button::after {
      content: "→";
      margin-left: 28px;
      font-size: 24px;
      line-height: 1;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
      text-align: center;
    }

    .error {
      display: none;
      margin: 0;
      color: #9a261f;
      font-size: 13px;
    }

    .error.is-visible {
      display: block;
    }

    footer {
      padding: 40px 5vw 56px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 760px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px 24px;
      }

      nav {
        gap: 16px;
      }

      main {
        padding: 34px 20px 76px;
      }

      .form-hero {
        width: calc(100vw - 40px);
        margin-bottom: 34px;
      }

      .form-hero img {
        height: clamp(210px, 58vw, 330px);
        object-position: center top;
      }

      h1 {
        font-size: clamp(34px, 9vw, 46px);
        letter-spacing: 0.06em;
      }

      .intro {
        font-size: 15px;
      }

      .badges {
        border-radius: 0;
      }

      .badges span {
        font-size: 13px;
        padding: 9px 8px;
      }

      .choice-grid {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
        font-size: 17px;
      }
    }

  /* Global white background and frameless images */
  :root {
    --bg: #ffffff !important;
    --paper: #ffffff !important;
    --card: #ffffff !important;
    --white: #ffffff !important;
  }

  html,
  body {
    background: #ffffff !important;
  }

  figure,
  img,
  .lesson-image,
  .lesson-header-image,
  .teacher-photo,
  .inline-work-image,
  .mobile-studio-image,
  .hero-image,
  .image-frame,
  .visual-card {
    border: 0 !important;
    outline: 0 !important;
    box-shadow: none !important;
  }

  figure img,
  .lesson-image img,
  .lesson-header-image img,
  .teacher-photo img,
  .inline-work-image img,
  .hero-image img,
  .image-frame img,
  .visual-card img {
    border: 0 !important;
    outline: 0 !important;
    box-shadow: none !important;
  }
</style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y1792EBWTT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-Y1792EBWTT");
  </script>
</head>

<body>
  <header>
    <a class="brand" href="/ja/">Atelier Composition Son</a>
    <nav aria-label="Navigation">
      <a href="/ja/">ホーム</a>
      <a href="/ja/#modules">レッスン内容</a>
      <a href="/ja/#price">料金</a>
    </nav>
  </header>

  <main>
    <figure class="form-hero" aria-label="Contact form">
      <img src="../images/contact_hero.png" alt="Contact form - 無料相談申し込みフォームのイメージ">
    </figure>

    <div class="kicker">Free Consultation</div>
    <div class="mark" aria-hidden="true"></div>
    <h1>30分無料相談<br>お申し込み</h1>

    <p class="intro">
      入力は2〜3分で完了します。<br>
      送信後、48時間以内を目安にメールでご連絡します。<br>
      初心者の方、相談だけの方も歓迎です。無理な勧誘はありません。
    </p>

    <div class="badges" aria-label="無料相談の特徴">
      <span>30分無料</span>
      <span>初心者歓迎</span>
      <span>相談のみでもOK</span>
    </div>

    <form id="booking-form" action="https://formspree.io/f/mbdbpqrj" method="POST">
      <input type="hidden" name="form_type" value="free_consultation">
      <input type="hidden" name="source_page" value="/ja/booking.html">

      <div class="field">
        <label for="name">お名前</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="例）山田 太郎" required>
      </div>

      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="例）taro.yamada@example.com" required>
      </div>

      <fieldset>
        <legend>学びたい内容</legend>
        <div class="choice-grid">
          <label class="choice"><input type="checkbox" name="interests[]" value="作曲">作曲</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="DTM">DTM</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="音楽理論">音楽理論</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="ソルフェージュ">ソルフェージュ</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="和声・対位法">和声・対位法</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="電子音響">電子音響</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="AI音楽制作">AI音楽制作</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="受験・ポートフォリオ">受験・ポートフォリオ</label>
          <label class="choice"><input type="checkbox" name="interests[]" value="その他">その他</label>
        </div>
        <p id="interest-error" class="error">学びたい内容を1つ以上選択してください。</p>
      </fieldset>

      <div class="field">
        <label for="message">今の状況・相談したいこと</label>
        <textarea id="message" name="message" placeholder="例）作曲を始めたばかりで、何から学べばよいか相談したいです。" required></textarea>
      </div>

      <div class="field">
        <label for="schedule">希望曜日・時間帯（任意）</label>
        <input id="schedule" name="preferred_schedule" type="text" placeholder="例）平日 夜（19時以降）">
      </div>

      <div class="field">
        <label for="tools">使用DAW・作品URL（任意）</label>
        <input id="tools" name="daw_or_work_url" type="text" placeholder="例）Logic Pro / SoundCloud、YouTube、Google Driveなど">
      </div>

      <div class="submit-row">
        <button type="submit" data-track="free_consultation_submit_click">30分無料相談を申し込む</button>
        <p class="note">
          送信後、48時間以内を目安にメールでご連絡します。<br>
          決済・キャンセル・返金に関する条件は <a href="terms.html">レッスン規約</a> をご確認ください。
        </p>
      </div>
    </form>
  </main>

  <footer>
    © Atelier Composition Son
  </footer>

  <script>
    document.getElementById("booking-form").addEventListener("submit", function(event) {
      const checked = document.querySelectorAll('input[name="interests[]"]:checked').length > 0;
      const error = document.getElementById("interest-error");

      if (!checked) {
        event.preventDefault();
        error.classList.add("is-visible");
        error.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      error.classList.remove("is-visible");
    });
  </script>
  <script defer src="../assets/js/acs-tracking.js"></script>
</body>
</html>
