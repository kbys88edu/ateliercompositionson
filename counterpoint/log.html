<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <meta name="robots" content="noindex" />
  <title>学習記録｜Counterpoint Training｜Atelier Composition Son</title>
  <link rel="stylesheet" href="css/study-log.css?v=20261030" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans JP", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; color: #22392c; background: #f1f5ee; }
    .log-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; max-width: 880px; margin: 0 auto; padding: 20px 20px 0; }
    .log-top a { color: inherit; text-decoration: none; font-size: 0.92rem; opacity: 0.75; }
    .log-top label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: rgba(34, 57, 44,0.62); }
    .log-top select { font: inherit; border: 1px solid rgba(34, 57, 44,0.14); border-radius: 999px; padding: 8px 12px; background: #fff; }
    @media print { .log-top { display: none; } }
  </style>
</head>
<body>
  <div class="log-top">
    <a href="index.html" data-back>← 対位法トレーニングへ戻る</a>
    <label>
      <span data-lang-label>言語</span>
      <select id="languageSelect">
        <option value="ja">日本語</option>
        <option value="fr">Français</option>
      </select>
    </label>
  </div>
  <main class="study-log-page" data-study-log-page></main>
  <script src="js/study-log.js?v=20261030" data-site="counterpoint"></script>
  <script>
    (function () {
      const select = document.getElementById("languageSelect");
      const back = document.querySelector("[data-back]");
      const label = document.querySelector("[data-lang-label]");
      function apply(lang) {
        document.documentElement.lang = lang;
        back.textContent = lang === "fr" ? "← Retour à l’entraînement" : "← 対位法トレーニングへ戻る";
        label.textContent = lang === "fr" ? "Langue" : "言語";
        try { localStorage.setItem("counterpointLogLanguage", lang); } catch (e) {}
        if (window.StudyLog) window.StudyLog.render();
      }
      let initial = "ja";
      try { initial = localStorage.getItem("counterpointLogLanguage") || "ja"; } catch (e) {}
      if (new URLSearchParams(location.search).get("lang") === "fr") initial = "fr";
      select.value = initial;
      select.addEventListener("change", () => apply(select.value));
      apply(initial);
    })();
  </script>
  <script defer src="../assets/js/acs-tracking.js"></script>
</body>
</html>
