<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <script src="auth.js"></script>

  <title>第一種2声対位法チェッカー｜Atelier Composition Son</title>
  <meta name="description" content="第一種2声対位法の協和音程、連続5度、連続8度を確認するオンラインチェッカーです。" />

  <link rel="stylesheet" href="css/style.css?v=20260601-exact-sample-rate />
</head>

<body>
  <main class="page">
    <header class="checker-header">
      <div class="top-controls">
        <div class="brand-row">
          <a class="brand-link" href="index.html" aria-label="Atelier Composition Son">
            <img class="brand-logo" src="images/acs-logo.png?v=logo-20260601" alt="Atelier Composition Son" />
            <span class="brand-text">Atelier Composition Son</span>
          </a>
          <a class="back-link" href="index.html" data-i18n="backLink">← トップへ戻る</a>
        </div>

        <label class="language-control" for="languageSelect">
          <span data-i18n="languageLabel">言語</span>
          <select id="languageSelect" onchange="setLanguage(this.value)">
            <option value="ja">日本語</option>
            <option value="fr">Français</option>
          </select>
        </label>
      </div>

      <p class="eyebrow">First Species Counterpoint / Two Voices</p>
      <h1 data-i18n="title">第一種2声対位法チェッカー</h1>
      <p class="lead" data-i18n="lead">
        下段の定旋律に対して、上段に1対1の対旋律を入力します。上段の五線譜をクリックして入力してください。
      </p>
    </header>

    <section class="checker-panel">
      <textarea id="cantus" class="hidden-input">C4 D4 E4 F4 G4 F4 E4 D4 C4</textarea>
      <textarea id="counterpoint" class="hidden-input"></textarea>

      <div class="exercise-tools">
        <label class="exercise-control" for="exerciseSelect">
          <span data-i18n="exerciseLabel">課題</span>
          <select id="exerciseSelect"></select>
        </label>

        <button class="button small" type="button" onclick="loadSelectedExercise()" data-i18n="loadExercise">
          課題を読み込む
        </button>

        <p class="exercise-description" id="exerciseDescription">課題を選択してください。</p>
      </div>

      <div class="score-tools">
        <button class="button small" type="button" onclick="loadExample()" data-i18n="loadExample">
          例題を読み込む
        </button>
        <button class="button small" type="button" onclick="deleteSelectedNote()" data-i18n="deleteSelected">
          選択音を削除
        </button>
        <button class="button small" type="button" onclick="undoCounterpointNote()" data-i18n="deleteLast">
          最後の音を削除
        </button>
        <button class="button small" type="button" onclick="clearCounterpoint()" data-i18n="clearCounterpoint">
          対旋律をクリア
        </button>
        <button class="button small" type="button" onclick="renderScore()" data-i18n="refreshScore">
          楽譜を更新
        </button>
        <button class="button small" type="button" onclick="playSelectedNote()" data-i18n="playSelected">
          選択音を鳴らす
        </button>
        <button class="button small" type="button" onclick="exportMidi()" data-i18n="exportMidi">
          MIDIを書き出す
        </button>
      </div>

      <div class="playback-tools">
        <button id="playPauseButton" class="button primary" type="button" onclick="togglePlayback()">
          再生
        </button>

        <button class="button small" type="button" onclick="stopPlayback(true)" data-i18n="resetStart">
          最初に戻す
        </button>

        <label class="tempo-control" for="tempoInput">
          Tempo
          <input id="tempoInput" type="number" min="40" max="180" value="66" />
        </label>

        <label class="playback-control" for="playbackModeSelect">
          <span data-i18n="playbackModeLabel">再生対象</span>
          <select id="playbackModeSelect">
            <option value="both" data-i18n="playBoth">両声</option>
            <option value="cantus" data-i18n="playCantus">定旋律のみ</option>
            <option value="counterpoint" data-i18n="playCounterpoint">対旋律のみ</option>
          </select>
        </label>

        <label class="timbre-control" for="timbreSelect">
          <span data-i18n="timbreLabel">音色</span>
          <select id="timbreSelect" onchange="previewTimbre()">
            <option value="humanVoice" selected data-i18n="timbreHumanVoice">人の声</option>
          </select>
        </label>

        <p class="playback-hint" data-i18n="playbackHint">
          Space：再生 / 停止　｜　← / →：前後の音へ移動　｜　↑ / ↓：選択音を半音移動
        </p>
      </div>

      <div class="score-box">
        <div class="score-head">
          <div>
            <h2 data-i18n="scoreInputTitle">五線入力</h2>
            <p data-i18n="scoreInputHelp">
              上段の対旋律だけ編集できます。下段の定旋律はヘ音記号で表示されます。
            </p>
          </div>
          <div class="score-status" id="scoreStatus">対旋律：0音 / 定旋律：0音</div>
        </div>

        <svg
          id="scoreEditor"
          class="score-editor"
          viewBox="0 0 960 350"
          role="img"
          aria-label="第一種2声対位法の楽譜入力エリア"
          tabindex="0"
        ></svg>
      </div>

      <div class="current-notes">
        <h2 data-i18n="currentInput">現在の入力</h2>
        <p><strong data-i18n="cantusLabel">定旋律：</strong><span id="cantusDisplay"></span></p>
        <p><strong data-i18n="counterpointLabel">対旋律：</strong><span id="counterpointDisplay"></span></p>
      </div>

      <button class="button primary" onclick="analyzeCounterpoint()" data-i18n="analyze">
        解析する
      </button>
    </section>

    <section class="result-section">
      <h2 data-i18n="analysisResult">解析結果</h2>
      <div id="summary" class="summary-box"></div>
      <div id="result" class="result-box"></div>
    </section>
  </main>

  <script src="js/counterpoint.js?v=20260601-exact-sample-rate></script>
</body>
</html>
