<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Atelier Composition Son — Instagram reel</title>
<meta name="viewport" content="width=1080">
<style>
@font-face { font-family: 'ACS Marcellus'; src: url('fonts/marcellus-subset.woff2') format('woff2'); }
@font-face { font-family: 'ACS Mincho';    src: url('fonts/shippori-mincho-subset.woff2') format('woff2'); }
:root { --paper:#f3f1eb; --ink:#111; --mut:#6f6c66; }
html, body { margin:0; background:#000; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; color:var(--ink); }
canvas { position:absolute; left:0; top:0; width:1080px; height:1920px; }
.t { position:absolute; left:0; width:1080px; text-align:center; opacity:0; white-space:nowrap; will-change:opacity,transform; }
.jp { font-family:'ACS Mincho','IPAGothic',serif; font-weight:500; }
.la { font-family:'ACS Marcellus','Liberation Serif',serif; font-weight:400; }
/* call to action */
#wash  { position:absolute; left:0; top:700px; width:1080px; height:560px; opacity:0;
         background:radial-gradient(ellipse 60% 50% at 50% 50%, var(--paper) 45%, rgba(243,241,235,0) 100%); }
#main  { top:830px;  font-size:92px; letter-spacing:.12em; padding-left:.12em; box-sizing:border-box; }
#main .la { font-size:100px; letter-spacing:.02em; }
#brand { top:1000px; font-size:40px; letter-spacing:.08em; }
#sub   { top:1062px; font-size:28px; letter-spacing:.16em; padding-left:.16em; box-sizing:border-box; }
#url   { top:1112px; font-size:24px; letter-spacing:.14em; color:var(--mut); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="wash"></div>
  <div class="t jp" id="main"><span class="la">30</span>分無料相談</div>
  <div class="t la" id="brand">Atelier Composition Son</div>
  <div class="t jp" id="sub">作曲・音楽理論・DTM・電子音響</div>
  <div class="t la" id="url">ateliercompositionson.com</div>
</div>
<script src="features.js"></script>
<script>
'use strict';
const W = 1080, H = 1920, PN = 768;                       // canvas, particle texture side (409,600 grains of sand)
const SUBSTEPS = 6;
const TL = window.TL, FEAT = window.FEAT, FPS = TL.fps;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const lerp = (a, b, u) => a + (b - a) * u;
const easeIO = u => u * u * (3 - 2 * u);

/* ------------------------------------------------------------------ WebGL */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
gl.getExtension('EXT_color_buffer_float');
const FS_TRI = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;
function prog(vs, fs) {
  const mk = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o) + '\n' + s); return o; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name.replace('[0]', '')] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
function tex(w, h, internal, fmt, type, filter = gl.NEAREST) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(t) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; }
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);

/* ---- Chladni field (shared GLSL): F = sum w * (cos(n pi x) cos(m pi y) + cos(m pi x) cos(n pi y)) with its gradient */
const MAXM = 12;
const GLSL_FIELD = `
const float PI = 3.14159265358979;
uniform int uNM; uniform float uN[${MAXM}]; uniform float uMm[${MAXM}]; uniform float uW[${MAXM}];
vec3 chladni(vec2 p){                                  // returns (F, dF/dx, dF/dy)
  vec3 r = vec3(0.0);
  for (int i = 0; i < ${MAXM}; i++) {
    if (i >= uNM) break;
    float n = uN[i] * PI, m = uMm[i] * PI, w = uW[i];
    float cnx = cos(n*p.x), snx = sin(n*p.x), cmy = cos(m*p.y), smy = sin(m*p.y);
    float cmx = cos(m*p.x), smx = sin(m*p.x), cny = cos(n*p.y), sny = sin(n*p.y);
    r.x += w * (cnx*cmy + cmx*cny);
    r.y += w * (-n*snx*cmy - m*smx*cny);
    r.z += w * (-m*cnx*smy - n*cmx*sny);
  }
  return r;
}`;
const GLSL_HASH = `
uint pcg(uint v){ uint s = v*747796405u + 2891336325u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
vec3 rnd3(uvec2 id, uint seed){ uint a = pcg(id.x + pcg(id.y + pcg(seed))); uint b = pcg(a + 1234567u); uint c = pcg(b + 7654321u);
  return vec3(float(a), float(b), float(c)) / 4294967295.0; }`;

/* ---- 1. sand: random walk whose step is proportional to the local vibration |F| (the Chladni algorithm), plus a pull to the nodal lines */
const progUpdate = prog(FS_TRI, `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uPos; uniform float uA, uDrift, uFloor, uBurst, uAsp; uniform uint uSeed;
${GLSL_FIELD}${GLSL_HASH}
out vec4 o;
void main(){
  ivec2 ij = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(uPos, ij, 0); vec2 p = s.xy;
  vec3 r = rnd3(uvec2(ij), uSeed);
  vec3 f = chladni(p);
  vec2 g = vec2(f.y, f.z / uAsp);                     // the plate is the whole screen: 1 wide, H/W tall
  float gm2 = dot(g, g) + 0.3;
  vec2 toLine = f.x * g / gm2;                         // Newton step: the vector from here to the nearest nodal line
  float dist = abs(f.x) / sqrt(gm2);                   // distance to the line, so grains spread evenly along it (|F| alone piles them into corners)
  vec2 step_ = (r.xy - 0.5) * 2.0 * uA * (min(dist, 0.35) + uFloor) - uDrift * toLine;
  float sl = length(step_); if (sl > 0.06) step_ *= 0.06 / sl;
  p += vec2(step_.x, step_.y / uAsp);
  p = abs(p); p = 1.0 - abs(1.0 - p);                  // reflect at the plate edge
  if (r.z < uBurst) p = rnd3(uvec2(ij) + 17u, uSeed + 99u).xy;
  o = vec4(clamp(p, 0.0, 1.0), 0.0, 1.0);
}`);

/* ---- 2. scene background: paper <-> black, thin-film iridescence for the dark section */
const progBg = prog(FS_TRI, `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uDark, uFilm, uTime, uFlash, uImgAmt; uniform int uImgMode; uniform vec3 uPaper, uInk2; uniform sampler2D uImg;
out vec4 o;
float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++){ s += a*vn(p); p = p*2.03 + 7.1; a *= 0.5; } return s; }
float halftone(vec2 px, float ang, float cell, float tone){          // one screen of a screen print: dots on a rotated grid
  float c = cos(ang), s = sin(ang); vec2 q = mat2(c, -s, s, c) * px / cell;
  float d = length(fract(q) - 0.5), r = sqrt(clamp(tone, 0.0, 1.0)) * 0.72;
  return smoothstep(r + 0.5 / cell * 2.0, r - 0.5 / cell * 2.0, d);
}
vec3 screenprint(vec2 uv, vec2 px, vec3 col){                        // two inks, slightly off register, uneven coverage
  vec2 off = vec2(5.0, -3.0) / uRes;
  float L1 = texture(uImg, uv).r, L2 = texture(uImg, uv + off).r;
  float uneven = 0.78 + 0.22 * fbm(px * 0.035);
  float k1, k2;
  if (uImgMode == 0) {                                                // line art (score): solid ink, second colour plate misregistered
    k1 = smoothstep(0.62, 0.35, L1) * uneven;
    k2 = smoothstep(0.7, 0.4, L2) * 0.85 * (0.7 + 0.3 * fbm(px * 0.02 + 3.0));
  } else {                                                            // photograph: halftone black + a flat colour for the midtones
    k1 = halftone(px, 0.785, 7.0, smoothstep(0.92, 0.08, L1)) * uneven;
    k2 = smoothstep(0.85, 0.35, L2) * 0.75 * (0.75 + 0.25 * fbm(px * 0.02 + 3.0));
  }
  col *= mix(vec3(1.0), uInk2, k2 * uImgAmt);
  col = mix(col, vec3(0.09, 0.09, 0.1), k1 * 0.92 * uImgAmt);
  return col;
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; uv.y = 1.0 - uv.y;
  vec3 col = mix(uPaper, vec3(0.012), uDark);
  if (uImgAmt > 0.001) col = screenprint(uv, gl_FragCoord.xy, col);
  if (uFilm > 0.001) {
    vec2 q = (uv - 0.5) * vec2(1.6, 2.6);
    vec2 w = vec2(fbm(q*1.3 + vec2(0.0, uTime*0.35)), fbm(q*1.3 + vec2(5.2, -uTime*0.28)));
    float th = fbm(q*1.1 + 2.4*(w-0.5) + vec2(0.0, uTime*0.12));          // film thickness, dragged by a swirl
    th += 0.55 * (uv.y - 0.5);                                              // drains downward
    vec3 irid = 0.5 + 0.5*cos(6.28318*(th*vec3(1.00, 1.12, 1.27)*1.9 + vec3(0.00, 0.12, 0.30)));
    float m = smoothstep(0.30, 0.78, fbm(q*0.8 + 3.0*(w-0.5) + 9.0));
    col += irid * m * uFilm * 0.55 * (0.25 + 0.75*smoothstep(0.2, 0.8, th));
  }
  col = mix(col, vec3(1.0), uFlash);
  o = vec4(col, 1.0);
}`);

/* ---- 3. grains: points read their position from the sand texture */
const progPts = prog(`#version 300 es
precision highp float; precision highp int;
uniform sampler2D uPos; uniform vec2 uRes; uniform float uPt;
void main(){
  ivec2 tc = ivec2(gl_VertexID % ${PN}, gl_VertexID / ${PN});
  vec2 p = texelFetch(uPos, tc, 0).xy;
  vec2 px = vec2(p.x, 1.0 - p.y) * uRes;
  gl_Position = vec4(px.x / uRes.x * 2.0 - 1.0, 1.0 - px.y / uRes.y * 2.0, 0.0, 1.0);
  gl_PointSize = uPt;
}`, `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 o;
void main(){ vec2 d = gl_PointCoord - 0.5; float a = smoothstep(0.5, 0.18, length(d)); o = vec4(uColor.rgb, uColor.a * a); }`);

/* ---- 4. stop-motion memory: on a fire frame the instant is stamped, the older ones dim (photodynamism-style multiple exposure) */
const progHeld = prog(FS_TRI, `#version 300 es
precision highp float;
uniform sampler2D uHeld, uScene; uniform vec2 uRes; uniform float uDecay, uStamp;
out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy / uRes; vec3 h = texture(uHeld, uv).rgb * uDecay; vec3 s = texture(uScene, uv).rgb;
  o = vec4(max(h, s * uStamp), 1.0); }`);

/* ---- 5. composite: held frames + live frame, chromatic split on the strike, a little grain */
const progOut = prog(FS_TRI, `#version 300 es
precision highp float;
uniform sampler2D uHeld, uScene; uniform vec2 uRes; uniform float uLive, uCA, uGrain, uSeed, uFlash;
out vec4 o;
float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; vec2 d = vec2(uCA, 0.0) / uRes;
  vec3 live = vec3(texture(uScene, uv + d).r, texture(uScene, uv).g, texture(uScene, uv - d).b);
  vec3 held = vec3(texture(uHeld, uv + d).r, texture(uHeld, uv).g, texture(uHeld, uv - d).b);
  vec3 c = max(live * uLive, held * (1.0 - uFlash));
  c += (h21(gl_FragCoord.xy + uSeed) - 0.5) * uGrain;
  o = vec4(c, 1.0);
}`);

/* ---- GPU resources */
const posTex = [0, 1].map(() => tex(PN, PN, gl.RGBA32F, gl.RGBA, gl.FLOAT));
const posFbo = posTex.map(fbo);
const sceneTex = tex(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR); const sceneFbo = fbo(sceneTex);
const heldTex = [0, 1].map(() => tex(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR)); const heldFbo = heldTex.map(fbo);
let cur = 0, hcur = 0, seedCounter = 1;
(function initSand() {                                  // grains start scattered uniformly (seeded, deterministic)
  const a = new Float32Array(PN * PN * 4); let s = 1108;
  const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < PN * PN; i++) { a[i * 4] = r(); a[i * 4 + 1] = r(); a[i * 4 + 3] = 1; }
  gl.bindTexture(gl.TEXTURE_2D, posTex[0]); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, PN, PN, gl.RGBA, gl.FLOAT, a);
  for (const f of heldFbo) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
})();

function setFieldUniforms(p, modes) {
  const n = new Float32Array(MAXM), m = new Float32Array(MAXM), w = new Float32Array(MAXM);
  modes.slice(0, MAXM).forEach((q, i) => { n[i] = q[0]; m[i] = q[1]; w[i] = q[2]; });
  gl.uniform1i(p.u.uNM, Math.min(modes.length, MAXM)); gl.uniform1fv(p.u.uN, n); gl.uniform1fv(p.u.uMm, m); gl.uniform1fv(p.u.uW, w);
}

/* ------------------------------------------------------------------ the picture, as a function of the score */
const STORM_FIG = [[2, 5], [3, 6], [2, 7], [4, 7], [3, 8], [5, 8], [4, 9], [2, 9], [5, 6], [3, 7], [4, 5]];
const evFrames = TL.events.map(e => Math.round(e * FPS));

function figure(f, t) {
  // pure tone: one nodal line  ->  partial k arrives: figure (k-1, k)  ->  second voice: (2,3)/(3,4) rotating, locked on (2,3) at 3:2
  const pk = f.pk; const modes = [];
  modes.push([0, 1, 1 - pk[1]]);
  for (let k = 2; k <= 6; k++) {
    const nextOut = k < 6 ? 1 - pk[k] : 1 - f.b;                         // pk[k] is partial k+1
    modes.push([k - 1, k, pk[k - 1] * nextOut]);
  }
  if (f.b > 0) {
    modes.push([2, 3, f.b * Math.cos(f.ph)]);
    modes.push([3, 4, f.b * Math.sin(f.ph)]);
  }
  return modes.filter(q => q[2] > 0.002);
}

function frameState(i) {
  const f = FEAT[i], t = f.t;
  const storm = t < TL.darkOut0 ? sstep(TL.strike - 0.02, TL.strike + 0.05, t) : 0;
  const dark = t < TL.darkOut0 ? sstep(TL.strike + 0.05, TL.strike + 0.09, t) : 0;   // hard cut back to paper
  const flash = (t >= TL.strike - 0.001 && t < TL.strike + 0.07) ? 1 - sstep(TL.strike + 0.02, TL.strike + 0.07, t) : 0;
  const riser = sstep(8.7, TL.strike, t);
  return { f, t, storm, dark, flash, riser };
}

function modesFor(S, i) {
  const { f, t, storm } = S;
  if (t >= TL.strike - 0.001 && t < TL.darkOut0) {                      // stop-motion figures, changing at each fire
    let k = -1; for (let j = 0; j < evFrames.length; j++) if (i >= evFrames[j]) k = j;
    const q = STORM_FIG[Math.max(0, k) % STORM_FIG.length], q2 = STORM_FIG[(Math.max(0, k) + 4) % STORM_FIG.length];
    return [[q[0], q[1], 1], [q2[0], q2[1], 0.3]];
  }
  if (t >= TL.darkOut0) return [[2, 3, 1]];                              // the fifth: Chladni (2,3), where the piece comes to rest
  return figure(f, t);
}

function stepSim(S, i) {
  const { f, t } = S;
  const settleIn = 1 - sstep(0.0, 1.8, t);                               // grains fall in from a scatter at the start
  const rough = f.R, lv = f.lv;
  let A = 0.2 + 0.2 * rough + 0.06 * lv + 0.2 * S.riser * S.riser + 0.35 * settleIn;
  let drift = 0.07 - 0.04 * rough + 0.03 * settleIn;
  let burst = 0;
  if (t >= TL.strike - 0.001 && t < TL.darkOut0) {
    const onFire = evFrames.includes(i);
    A = 0.3; drift = 0.14; burst = (i === evFrames[0]) ? 0.65 : (onFire ? 0.1 : 0.0);
  }
  if (t >= TL.darkOut0) { A = 0.15 + 0.05 * lv; drift = t < TL.darkOut0 + 0.5 ? 0.14 : 0.06; }
  gl.useProgram(progUpdate.p);
  const modes = modesFor(S, i);
  setFieldUniforms(progUpdate, modes);
  // the figure changes when a partial (or the second voice) enters: the plate shakes the sand loose, it falls onto the new nodal lines
  let pulse = 0;
  for (const te of TL.partialT.slice(1).concat([TL.bIn])) if (t >= te) pulse = Math.max(pulse, Math.exp(-(t - te) / 0.22));
  A += 0.25 * pulse;
  gl.uniform1f(progUpdate.u.uAsp, H / W); gl.uniform1f(progUpdate.u.uA, A); gl.uniform1f(progUpdate.u.uDrift, drift); gl.uniform1f(progUpdate.u.uFloor, 0.006 + 0.04 * pulse);
  gl.viewport(0, 0, PN, PN);
  for (let s = 0; s < SUBSTEPS; s++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, posFbo[1 - cur]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posTex[cur]); gl.uniform1i(progUpdate.u.uPos, 0);
    gl.uniform1ui(progUpdate.u.uSeed, seedCounter++);
    gl.uniform1f(progUpdate.u.uBurst, s === 0 ? burst : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3); cur = 1 - cur;
  }
}

function drawScene(S, i) {
  const { f, t } = S;
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo); gl.viewport(0, 0, W, H); gl.disable(gl.BLEND);
  gl.useProgram(progBg.p);
  const film = S.dark * (0.3 + 0.7 * S.storm) * 0.42;
  gl.uniform2f(progBg.u.uRes, W, H); gl.uniform1f(progBg.u.uDark, S.dark); gl.uniform1f(progBg.u.uFilm, film);
  gl.uniform1f(progBg.u.uImgAmt, bgTex ? 1 - sstep(1.0, 3.0, t) : 0);       // the picture gives way as the sand gathers
  if (bgTex) { gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bgTex); gl.uniform1i(progBg.u.uImg, 2);
    gl.uniform1i(progBg.u.uImgMode, BG.mode); gl.uniform3f(progBg.u.uInk2, ...BG.ink2); }
  gl.uniform1f(progBg.u.uTime, t); gl.uniform1f(progBg.u.uFlash, S.flash); gl.uniform3f(progBg.u.uPaper, 0.953, 0.945, 0.922);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(progPts.p); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, posTex[cur]); gl.uniform1i(progPts.u.uPos, 0);
  gl.uniform2f(progPts.u.uRes, W, H); gl.uniform1f(progPts.u.uPt, 1.8);
  const ink = lerp(0.07, 0.96, S.dark);
  gl.uniform4f(progPts.u.uColor, ink, ink, ink * 0.985, lerp(0.8, 0.9, S.dark) * (1 - S.flash) * (1 - 0.8 * sstep(TL.cta - 0.1, TL.cta + 0.4, t)));   // sand steps back behind the text
  gl.drawArrays(gl.POINTS, 0, PN * PN); gl.disable(gl.BLEND);
}

function post(S, i) {
  const { t } = S;
  const inStorm = t >= TL.strike - 0.001 && t < TL.darkOut0;
  const onFire = evFrames.includes(i);
  // held memory
  gl.useProgram(progHeld.p); gl.bindFramebuffer(gl.FRAMEBUFFER, heldFbo[1 - hcur]); gl.viewport(0, 0, W, H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, heldTex[hcur]); gl.uniform1i(progHeld.u.uHeld, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(progHeld.u.uScene, 1);
  gl.uniform2f(progHeld.u.uRes, W, H);
  gl.uniform1f(progHeld.u.uDecay, !inStorm ? 0.0 : (onFire ? 0.6 : 0.975)); gl.uniform1f(progHeld.u.uStamp, (inStorm && onFire && S.flash < 0.05) ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3); hcur = 1 - hcur;
  // composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(progOut.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, heldTex[hcur]); gl.uniform1i(progOut.u.uHeld, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(progOut.u.uScene, 1);
  gl.uniform2f(progOut.u.uRes, W, H);
  const live = inStorm ? Math.max(S.flash, 0.5) : 1;
  gl.uniform1f(progOut.u.uLive, live);
  gl.uniform1f(progOut.u.uCA, 0.35 + 6 * Math.exp(-(t - TL.strike) * 7) * (t >= TL.strike ? 1 : 0) + 1.2 * S.dark);
  gl.uniform1f(progOut.u.uGrain, 0.035 + 0.05 * S.dark); gl.uniform1f(progOut.u.uSeed, i * 1.37);
  gl.uniform1f(progOut.u.uFlash, S.flash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ------------------------------------------------------------------ typography, driven by the same clock */
const $ = id => document.getElementById(id);
const el = { 
  wash: $('wash'), main: $('main'), brand: $('brand'), sub: $('sub'), url: $('url') };
const NAMES = ['', '', 'オクターヴ', '完全5度', '完全4度', '長3度', '短3度'];
function win(t, a, b, fade = 0.45) { return sstep(a, a + fade, t) * (1 - sstep(b - fade, b, t)); }
function put(node, o, dy = 0) { node.style.opacity = o.toFixed(3); node.style.transform = `translateY(${((1 - o) * dy).toFixed(1)}px)`; }
let lastHead = '';
function setText(node, s) { if (node.dataset.s !== s) { node.textContent = s; node.dataset.s = s; } }

function typeset(S, i) {
  const { f, t } = S;
  const paper = 1 - S.dark;
  // call to action
  const c0 = TL.cta, fade = (t0) => sstep(t0, t0 + 0.3, t);
  put(el.wash, fade(c0 - 0.05)); put(el.main, fade(c0));
  for (const n of [el.brand, el.sub, el.url]) put(n, fade(c0 + 0.35));
}

/* ------------------------------------------------------------------ one frame */
window.renderFrame = function (i) {
  const S = frameState(i);
  stepSim(S, i); drawScene(S, i); post(S, i); typeset(S, i); gl.finish();
  return S.t;
};
window.TOTAL = FEAT.length;
/* optional opening picture, screen-printed behind the sand: ?bg=score | place */
const BGS = { score: { mode: 0, ink2: [0.86, 0.36, 0.26] },           // Mozart score, vermilion second plate
              place: { mode: 1, ink2: [0.55, 0.62, 0.78] } };          // performance venue, slate-blue second plate
const bgName = new URLSearchParams(location.search).get('bg');
const BG = BGS[bgName] || null; let bgTex = null;
function loadBg() {
  return new Promise(res => {
    if (!BG) return res();
    const sc = document.createElement('script'); sc.src = `bg/${bgName}.js`;
    sc.onload = () => { const im = new Image(); im.onload = () => {
      bgTex = tex(W, H, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
      gl.bindTexture(gl.TEXTURE_2D, bgTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, im); res(); };
      im.src = window.BG_IMG; };
    document.head.appendChild(sc);
  });
}
Promise.all([document.fonts.ready, loadBg()]).then(() => { window.READY = true; });
</script>
