<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Atelier Composition Son — Instagram reel (editorial)</title>
<meta name="viewport" content="width=1080">
<style>
@font-face { font-family:'ACS Gothic'; font-weight:400; src:url('fonts/plex-sans-jp-400-subset.woff2') format('woff2'); }
@font-face { font-family:'ACS Gothic'; font-weight:500; src:url('fonts/plex-sans-jp-500-subset.woff2') format('woff2'); }
@font-face { font-family:'ACS Anton'; src:url('fonts/anton-subset.woff2') format('woff2'); }
@font-face { font-family:'ACS Mono'; font-weight:500; src:url('fonts/plex-mono-500-subset.woff2') format('woff2'); }
html, body { margin:0; background:#000; }
canvas { display:block; width:1080px; height:1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="features.js"></script>
<script src="bg/objs.js"></script>
<script>
'use strict';
/* Editorial / glitch version: black on paper. A dot-screened photograph is cut into blocks that slip out of register
   while the music is dissonant and snap back when it resolves on the fifth; ASCII-art instruments in the strobe section;
   Chladni iso-lines run underneath as the score's own drawing. */
const W = 1080, H = 1920, CELL = 4, NX = W / CELL + 1, NY = H / CELL + 1;
const TL = window.TL, FEAT = window.FEAT, FPS = TL.fps;
const PAPER = '#ffffff', INK = '#000000';                  // pure black and white
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function rng(seed) { let s = seed | 0; return () => { s = (s + 0x6D2B79F5) | 0; let z = Math.imul(s ^ (s >>> 15), 1 | s); z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z; return ((z ^ (z >>> 14)) >>> 0) / 4294967296; }; }
const snap = (v, g = 8) => Math.round(v / g) * g;

/* ---------------------------------------------------------------- Chladni iso-lines (marching squares) */
const MAXN = 16, CX = [], CY = [];
for (let n = 0; n < MAXN; n++) {
  const a = new Float32Array(NX), b = new Float32Array(NY);
  for (let i = 0; i < NX; i++) a[i] = Math.cos(n * Math.PI * i / (NX - 1));
  for (let j = 0; j < NY; j++) b[j] = Math.cos(n * Math.PI * j / (NY - 1));
  CX.push(a); CY.push(b);
}
const F = new Float32Array(NX * NY);
function field(modes) {
  F.fill(0);
  for (const [n, m, w] of modes) {
    const cxn = CX[n], cxm = CX[m], cyn = CY[n], cym = CY[m];
    for (let j = 0; j < NY; j++) { const a = cym[j] * w, b = cyn[j] * w, row = j * NX; for (let i = 0; i < NX; i++) F[row + i] += cxn[i] * a + cxm[i] * b; }
  }
}
function contour(L) {
  for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX - 1; i++) {
    const k = j * NX + i, a = F[k] - L, b = F[k + 1] - L, c = F[k + NX + 1] - L, d = F[k + NX] - L;
    const idx = (a > 0 ? 1 : 0) | (b > 0 ? 2 : 0) | (c > 0 ? 4 : 0) | (d > 0 ? 8 : 0);
    if (idx === 0 || idx === 15) continue;
    const px = i * CELL, py = j * CELL;
    const T = () => [px + CELL * a / (a - b), py], R = () => [px + CELL, py + CELL * b / (b - c)];
    const B = () => [px + CELL * d / (d - c), py + CELL], Lf = () => [px, py + CELL * a / (a - d)];
    const seg = (p, q) => { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); };
    switch (idx) {
      case 1: case 14: seg(Lf(), T()); break; case 2: case 13: seg(T(), R()); break;
      case 3: case 12: seg(Lf(), R()); break; case 4: case 11: seg(R(), B()); break;
      case 5: seg(Lf(), T()); seg(R(), B()); break; case 6: case 9: seg(T(), B()); break;
      case 7: case 8: seg(Lf(), B()); break; case 10: seg(T(), R()); seg(Lf(), B()); break;
    }
  }
}
function drawFigure(modes, levels, color, width) {
  field(modes); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath();
  for (const L of levels) contour(L); ctx.stroke();
}
function figure(f) {
  const pk = f.pk, modes = [[0, 1, 1 - pk[1]]];
  for (let k = 2; k <= 6; k++) modes.push([k - 1, k, pk[k - 1] * (k < 6 ? 1 - pk[k] : 1 - f.b)]);
  if (f.b > 0) { modes.push([2, 3, f.b * Math.cos(f.ph)]); modes.push([3, 4, f.b * Math.sin(f.ph)]); }
  return modes.filter(q => q[2] > 0.002);
}
const STORM_FIG = [[2, 5], [3, 6], [2, 7], [4, 7], [3, 8], [5, 8], [4, 9], [2, 9], [5, 6], [3, 7], [4, 5]];
const evFrames = TL.events.map(e => Math.round(e * FPS));

/* ---------------------------------------------------------------- pictures: dot screen, ASCII */
const imgs = {};
function loadImgs() {
  return Promise.all(Object.entries(window.OBJS).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = () => { imgs[k] = im; res(); }; im.src = src; })));
}
function coverData(img, w, h, fx = 0.5, fy = 0.5) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const s = Math.max(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
  g.drawImage(img, (w - dw) * fx, (h - dh) * fy, dw, dh); return g.getImageData(0, 0, w, h).data;
}
function screenCanvas(img, w, h, cell) {                     // a fine 45-degree dot screen, ink on paper (a newspaper photograph)
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = PAPER; g.fillRect(0, 0, w, h); g.fillStyle = INK;
  const d = coverData(img, w, h), a = Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a), R = Math.hypot(w, h);
  g.beginPath();
  for (let u = -R; u <= R; u += cell) for (let v = -R; v <= R; v += cell) {
    const x = w / 2 + u * ca - v * sa, y = h / 2 + u * sa + v * ca;
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const l = d[((y | 0) * w + (x | 0)) * 4] / 255, tone = Math.pow(clamp((0.92 - l) / 0.8), 1.3);   // steeper curve: clean whites, solid blacks
    const r = cell * 0.7 * Math.sqrt(tone); if (r > 0.35) { g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.2832); }
  }
  g.fill();
  const id = g.getImageData(0, 0, w, h), p = id.data;                 // 1-bit: every pixel is either ink or paper
  for (let i = 0; i < p.length; i += 4) { const v = p[i] < 128 ? 0 : 255; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
let RAMP = '';
function buildRamp() {                                        // order the glyphs by how much ink they carry
  const set = " .'`:-=+*cegarsCDEFGAB#%&@", c = document.createElement('canvas'); c.width = c.height = 48; const g = c.getContext('2d');
  const ink = [...set].map(ch => { g.clearRect(0, 0, 48, 48); g.font = '500 40px "ACS Mono"'; g.textBaseline = 'top'; g.fillText(ch, 4, 2);
    const d = g.getImageData(0, 0, 48, 48).data; let s = 0; for (let i = 3; i < d.length; i += 4) s += d[i]; return [ch, s]; });
  ink.sort((p, q) => p[1] - q[1]); RAMP = ink.map(p => p[0]).join('');
}
const AC = 14, AR = 24;                                       // ASCII cell (px)
function asciiGrid(img, light) {                              // light = glyphs for the bright parts (white text on black)
  const cols = Math.floor(W / AC), rows = Math.floor(H / AR), d = coverData(img, cols, rows), out = [];
  for (let j = 0; j < rows; j++) { let s = ''; for (let i = 0; i < cols; i++) {
    const l = d[(j * cols + i) * 4] / 255, tone = light ? l : 1 - l; s += RAMP[Math.min(RAMP.length - 1, Math.floor(Math.pow(tone, 1.1) * RAMP.length))]; } out.push(s); }
  return out;
}
function drawAscii(grid, color) {
  ctx.fillStyle = color; ctx.font = '500 21px "ACS Mono"'; ctx.textBaseline = 'top';
  for (let j = 0; j < grid.length; j++) ctx.fillText(grid[j], 2, j * AR + 1);
}

/* ---------------------------------------------------------------- the hero: a photograph out of register */
const HX = 96, HY = 300, HW = 888, HH = 960;
let hero = null, asciiFull = [];
const BEATS = [1.15, 1.15, 1.15, 3.0, 3.0, 3.9, 3.9, 4.8, 4.8, 5.7, 5.7, 6.4, 6.4, 7.0, 7.0, 8.3];
const BLOCKS = []; (function () {
  const r = rng(2026), kinds = ['band', 'band', 'shift', 'shift', 'shift', 'white', 'black', 'barsV', 'barsH', 'pixels'];
  for (const t of BEATS) {
    const k = kinds[Math.floor(r() * kinds.length)], sgn = r() < 0.5 ? -1 : 1, b = { t, k };
    if (k === 'band') { b.x = 0; b.w = HW; b.h = snap(16 + r() * 56); b.y = snap(r() * (HH - b.h)); b.dx = sgn * snap(24 + r() * 120); }
    else if (k === 'shift') { b.w = snap(96 + r() * 280); b.h = snap(48 + r() * 200); b.x = snap(r() * (HW - b.w)); b.y = snap(r() * (HH - b.h)); b.dx = sgn * snap(24 + r() * 104); }
    else if (k === 'white') { b.w = snap(64 + r() * 168); b.h = snap(48 + r() * 160); b.x = snap(r() * (HW - b.w)); b.y = snap(r() * (HH - b.h)); }
    else if (k === 'black') { b.w = b.h = snap(24 + r() * 56); b.x = snap(r() * (HW - b.w)); b.y = snap(r() * (HH - b.h)); }
    else if (k === 'barsV' || k === 'barsH') { b.w = snap(96 + r() * 160); b.h = snap(64 + r() * 120); b.x = snap(r() * (HW - b.w)); b.y = snap(r() * (HH - b.h));
      b.bars = []; let p = 0; const len = k === 'barsV' ? b.w : b.h; while (p < len) { const bw = 2 + Math.floor(r() * 4) * 2, gap = 2 + Math.floor(r() * 3) * 2; b.bars.push([p, bw]); p += bw + gap; } }
    else { b.n = 6 + Math.floor(r() * 5); b.s = 28; b.x = snap(r() * (HW - b.n * b.s)); b.y = snap(r() * (HH - b.s)); b.cells = Array.from({ length: b.n }, () => Math.floor(r() * 3)); }
    BLOCKS.push(b);
  }
})();
const LABELS = [   // detection boxes: what the lessons cover
  { t: 3.0, s: '作曲',     x: 552, y: 24,  w: 216, h: 320 },
  { t: 3.9, s: '音楽理論', x: 40,  y: 136, w: 320, h: 304 },
  { t: 4.8, s: 'DTM',      x: 312, y: 640, w: 264, h: 168 },
  { t: 5.7, s: '電子音響', x: 40,  y: 720, w: 248, h: 200 },
];
function dot50(x, y, w, h) {                                  // a flat 50 % grey made of dots (no grey ink)
  ctx.fillStyle = PAPER; ctx.fillRect(x, y, w, h); ctx.fillStyle = INK; ctx.beginPath();
  for (let yy = y + 3; yy < y + h; yy += 6) for (let xx = x + 3 + ((yy - y) / 6 % 2) * 3; xx < x + w; xx += 6) { ctx.moveTo(xx + 2, yy); ctx.arc(xx, yy, 2, 0, 6.2832); }
  ctx.fill();
}
function drawHero(t, f, ox = HX, oy = HY, clip = null, glitch = true) {
  ctx.save();
  if (clip) { ctx.beginPath(); ctx.rect(clip[0], clip[1], clip[2], clip[3]); ctx.clip(); }
  ctx.drawImage(hero, ox, oy);
  const lock = TL.bGlide1 - 0.05, beating = t >= TL.bIn && t < lock;
  if (glitch && t < lock + 0.0001 ? glitch && !(t >= lock) : false) {
    const amp = beating ? (1 + 2.5 * f.R) * (Math.cos(f.ph) >= 0 ? 1 : -1) : 1;
    for (const b of BLOCKS) {
      if (t < b.t) continue;
      const X = ox + b.x, Y = oy + b.y;
      if (b.k === 'band' || b.k === 'shift') ctx.drawImage(hero, b.x, b.y, b.w, b.h, X + snap(b.dx * amp, 4), Y, b.w, b.h);
      else if (b.k === 'white') { ctx.fillStyle = PAPER; ctx.fillRect(X, Y, b.w, b.h); }
      else if (b.k === 'black') { ctx.fillStyle = INK; ctx.fillRect(X, Y, b.w, b.h); }
      else if (b.k === 'barsV' || b.k === 'barsH') { ctx.fillStyle = PAPER; ctx.fillRect(X, Y, b.w, b.h); ctx.fillStyle = INK;
        for (const [p, bw] of b.bars) b.k === 'barsV' ? ctx.fillRect(X + p, Y, bw, b.h) : ctx.fillRect(X, Y + p, b.w, bw); }
      else for (let i = 0; i < b.n; i++) { const c = b.cells[i], xx = X + i * b.s;
        if (c === 0) { ctx.fillStyle = INK; ctx.fillRect(xx, Y, b.s, b.s); } else if (c === 1) { ctx.fillStyle = PAPER; ctx.fillRect(xx, Y, b.s, b.s); } else dot50(xx, Y, b.s, b.s); }
    }
  }
  ctx.restore();
}
function drawLabels(t, ox = HX, oy = HY) {
  ctx.lineWidth = 2; ctx.font = '500 26px "ACS Gothic"'; ctx.textBaseline = 'middle';
  for (const L of LABELS) {
    if (t < L.t) continue;
    ctx.strokeStyle = INK; ctx.strokeRect(ox + L.x + 1, oy + L.y + 1, L.w - 2, L.h - 2);
    const tw = ctx.measureText(L.s).width + 24;
    ctx.fillStyle = PAPER; ctx.fillRect(ox + L.x, oy + L.y - 38, tw, 38);
    ctx.strokeRect(ox + L.x + 1, oy + L.y - 37, tw - 2, 38);
    ctx.fillStyle = INK; ctx.fillText(L.s, ox + L.x + 12, oy + L.y - 18);
  }
}

/* ---------------------------------------------------------------- editorial furniture */
function bracket(x, y, flip, color) {                         // a heavy corner mark
  ctx.fillStyle = color; const L = 84, T = 14;
  if (!flip) { ctx.fillRect(x, y, L, T); ctx.fillRect(x, y, T, L); } else { ctx.fillRect(x - L, y - T, L, T); ctx.fillRect(x - T, y - L, T, L); }
}
function masthead(color) {                                    // a running head set vertically in the margin
  ctx.save(); ctx.translate(58, 1260); ctx.rotate(-Math.PI / 2); ctx.fillStyle = color;
  ctx.font = '500 19px "ACS Mono"'; ctx.textBaseline = 'middle';
  ctx.fillText('ATELIER COMPOSITION SON   /   ONLINE LESSONS   /   2026', 0, 0); ctx.restore();
}

/* ---------------------------------------------------------------- call to action */
let brandSize = 150;
function drawCTA(t, f) {
  const h1 = TL.ctaHits[0], h2 = h1 + 0.3;
  ctx.fillStyle = INK; ctx.font = `${brandSize}px "ACS Anton"`; ctx.textBaseline = 'alphabetic';
  const lh = brandSize * 0.98;
  ['ATELIER', 'COMPOSITION', 'SON'].forEach((s, i) => ctx.fillText(s, HX - 4, 250 + lh * (i + 1)));
  const by = 250 + lh * 3 + 40;                               // the photograph as a band, still out of register
  drawHero(9.0, FEAT[Math.round(8.0 * FPS)], HX, by - 330, [HX - 40, by, HW + 80, 360], true);
  bracket(HX + HW, by + 360 + 40, true, INK);
  if (t >= h2) {
    const y0 = by + 360 + 64;
    ctx.fillRect(HX, y0, HW - 120, 2);
    ctx.font = '500 40px "ACS Gothic"'; ctx.textBaseline = 'top'; ctx.fillText('30分無料相談', HX, y0 + 26);
    ctx.font = '400 28px "ACS Gothic"'; ctx.fillText('作曲・音楽理論・DTM・電子音響', HX, y0 + 86);
    ctx.font = '500 24px "ACS Mono"'; ctx.fillText('ateliercompositionson.com', HX, y0 + 134);
  }
}

/* ---------------------------------------------------------------- one frame */
window.renderFrame = function (i) {
  const f = FEAT[i], t = f.t;
  const inStorm = t >= TL.strike - 0.001 && t < TL.darkOut0, flash = t >= TL.strike - 0.001 && t < TL.strike + 0.07;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (flash) { ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); return t; }
  if (inStorm) {
    ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
    let k = -1; for (let j = 0; j < evFrames.length; j++) if (i >= evFrames[j]) k = j; k = Math.max(0, k);
    if (k % 2 === 1) drawAscii(asciiFull[((k - 1) / 2) % asciiFull.length], PAPER);
    else { const q = STORM_FIG[k % STORM_FIG.length]; drawFigure([[q[0], q[1], 1]], [-0.6, -0.3, 0, 0.3, 0.6], PAPER, 2.5); }
    return t;
  }
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  if (t >= TL.darkOut0) {                                     // after the cut: a beat of silence on the fifth, then the page
    if (t < TL.ctaHits[0]) { drawFigure([[2, 3, 1]], [0], INK, 2.5); return t; }
    drawCTA(t, f); bracket(HX, 150, false, INK); return t;
  }
  if (t < 1.15) {                                             // a staff; a scan line draws the first nodal line
    const wipe = H * sstep(0.3, 1.1, t);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, wipe); ctx.clip(); drawFigure(figure(f), [0], INK, 2.5); ctx.restore();
    ctx.fillStyle = INK; for (let k = -2; k <= 2; k++) { const y = 960 + k * 44; if (y > wipe) ctx.fillRect(0, y - 1, W, 2); }
    if (wipe > 2 && wipe < H - 2) ctx.fillRect(0, wipe - 2, W, 4);
    bracket(HX, 150, false, INK); return t;
  }
  const lv = f.b > 0 && f.R > 0.04 ? (() => { const d = 0.05 + 0.5 * f.R; return [-2 * d, -d, 0, d, 2 * d]; })() : [0];
  drawFigure(figure(f), lv, INK, 2.5);
  drawHero(t, f); drawLabels(t);
  bracket(HX, 150, false, INK); bracket(HX + HW, HY + HH + 120, true, INK);
  return t;
};
window.TOTAL = FEAT.length;
Promise.all([document.fonts.load('150px "ACS Anton"'), document.fonts.load('500 21px "ACS Mono"'), document.fonts.load('500 40px "ACS Gothic"'), document.fonts.load('400 28px "ACS Gothic"'), loadImgs()]).then(() => {
  buildRamp();
  hero = screenCanvas(imgs.kb, HW, HH, 4.6);
  asciiFull = ['synth', 'piano', 'mon', 'kb'].map(k => asciiGrid(imgs[k], true));
  ctx.font = '150px "ACS Anton"'; const w = ctx.measureText('COMPOSITION').width; brandSize = Math.floor(150 * (HW + 8) / w);
  window.READY = true;
});
</script>
</body>
</html>
